name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Setup Keystore (QiubyZhukhi)
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
            echo "Keystore decoded from secret."
          else
            echo "Using repository release.jks keystore."
          fi

      - name: Build Debug & Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD != '' && secrets.KEYSTORE_PASSWORD || 'QiubyZhukhiKey' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS != '' && secrets.KEY_ALIAS || 'qiubyzhukhi' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD != '' && secrets.KEY_PASSWORD || 'QiubyZhukhiKey' }}
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Organize Artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/HotspotManager-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/HotspotManager-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HotspotManager-apk
          path: dist/*.apk

      - name: Publish GitHub Release (Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          name: Hotspot Manager ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'pre') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'prarelease') }}
          body: |
            ## 📱 Hotspot Manager ${{ github.ref_name }}
            Release APK ini ditandatangani secara resmi oleh **QiubyZhukhi**.
            
            ### 📦 File Rilis:
            - **`HotspotManager-release.apk`**: APK Versi Release (Signed oleh QiubyZhukhi)
            - **`HotspotManager-debug.apk`**: APK Versi Debug
